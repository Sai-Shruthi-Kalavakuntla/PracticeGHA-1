name: Inputs Demo
on:
  workflow_dispatch:
    inputs: 
      environment:
        description: Choose the environment to deploy
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod
      artifact_tag:
        description: Choose the git tag to deploy
        required: true
        default: 1.1.1
jobs:
  inputs-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the app
        run: echo "Deploying the ${{ inputs.artifact_tag }} app to ${{ inputs.environment }}"
      
